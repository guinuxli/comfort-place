<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Your Comfort Place</title>
</head>
<body>
    <header>
        <div class="welcome-text">
            <h1>Hello There!</h1>
        </div>
    </header>

    <main>
        <div class="text">
            <p>This is a simple blog</p><br>
            <p>meant to be your comfort place</p><br>
            <p>with beautiful arts to admire.</p><br> 
        </div>
    </main>
    <footer>
        <audio id="song" src="./assets/rainy.ogg" loop></audio>
        <div class="square"></div>
        <div class="images">
            <img id="draws" src="./assets/draw2.jpeg" alt="Artwork 2 of 3">
        </div>
        <div class="cassete-img">
            <img id="cassete" src="./assets/cassete-removebg-preview.png" alt="cassete draw" style="cursor: pointer;">
        </div>
        <div class="footer-text">
            <p>Art made by July and Gui</p>
            <p>© 2026 Guilherme Costa. All rights reserved.</p>
        </div>

        <div class="buttons">
            <button id="previous">Previous</button>
            <button id="next">Next</button>
        </div>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
